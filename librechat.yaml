# LibreChat configuration (git-ignored). Full reference: librechat.example.yaml
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.17
cache: true

interface:
  # Greeting on a new chat. {{user.name}} is replaced with the signed-in user's name.
  customWelcome: 'How can I help you today, {{user.name}}?'

