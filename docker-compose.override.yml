# Local overrides (git-ignored). See docker-compose.override.yml.example for more options.

services:
  api:
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      # Custom look for the login page, served at /assets/custom/*. No LibreChat code is changed.
      - type: bind
        source: ./branding
        target: /app/client/dist/assets/custom
        read_only: true
      # CMU emblem in place of the LibreChat logo and icons (built by branding/build-icons.js).
      - ./branding/icons/logo.svg:/app/client/dist/assets/logo.svg:ro
      - ./branding/icons/favicon-16x16.png:/app/client/dist/assets/favicon-16x16.png:ro
      - ./branding/icons/favicon-32x32.png:/app/client/dist/assets/favicon-32x32.png:ro
      - ./branding/icons/apple-touch-icon-180x180.png:/app/client/dist/assets/apple-touch-icon-180x180.png:ro
      - ./branding/icons/icon-192x192.png:/app/client/dist/assets/icon-192x192.png:ro
      - ./branding/icons/maskable-icon.png:/app/client/dist/assets/maskable-icon.png:ro
    # Adds the branding stylesheet to index.html and sets the initial tab title (APP_TITLE in .env
    # takes over once the app loads), then starts LibreChat as the image normally does.
    # Bump ?v= after editing branding/space.css so browsers fetch the new version.
    command:
      - sh
      - -c
      - >-
        sed -i 's#<title>LibreChat</title>#<title>CMUBS AI Hub</title>#' /app/client/dist/index.html;
        grep -q 'assets/custom/space.css' /app/client/dist/index.html ||
        sed -i 's#</head>#<link rel="stylesheet" href="assets/custom/space.css?v=14" /></head>#' /app/client/dist/index.html;
        exec npm run backend

  # Expose the containerized MongoDB to this machine only, for MongoDB Compass.
  # Host port 27018 so it can't clash with a MongoDB installed directly on the host.
  # Connect Compass with: mongodb://127.0.0.1:27018/
  mongodb:
    ports:
      - "127.0.0.1:27018:27017"
