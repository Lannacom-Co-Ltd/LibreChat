<!-- Email wrapper for create_email_draft (Mustache, from the server's default_email_template.html).
     Plain and neutral, so the draft reads as the sender's own mail: no organisation name, a thin
     orange rule on top. Table layout and inline-safe CSS for Outlook and Gmail; text only, no
     images, because mail clients block images and data: URIs. Sarabun when the reader has it,
     else Tahoma. -->
<!DOCTYPE html>
<html lang="{{language}}">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="Content-Language" content="{{language}}" />
    <title>{{subject}}</title>
    <style>
        body { font-family: Sarabun, Tahoma, 'Leelawadee UI', Arial, sans-serif; font-size: 11pt; color: #1f1e1d; line-height: 1.5; margin: 0; padding: 0; }
        h2 { font-weight: bold; font-size: 12pt; color: #1f1e1d; margin: 12px 0 6px; }
        h3 { font-weight: bold; font-size: 11pt; color: #1f1e1d; margin: 10px 0 4px; }
        p { margin: 8px 0; }
        ul, ol { margin: 8px 0; padding-left: 22px; }
        li { margin: 3px 0; }
        a { color: #d9441a; }
        table.content td, table.content th { border: 1px solid #d8d5cc; padding: 4px 8px; }
    </style>
</head>
<body lang="{{language}}">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
    <tr>
        <td style="border-top: 3px solid #f05023; padding: 14px 16px 12px;">
{{{content}}}
        </td>
    </tr>
</table>
</body>
</html>
